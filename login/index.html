<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | RapidIdentity</title>
  <script src="../assets/theme-loader.js"></script>
  <link rel="stylesheet" href="../style.css">

  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, rgba(108,99,255,0.12), transparent 45%), var(--bg); color: var(--text); font-family: var(--font); }
    .auth-shell { width: min(520px, calc(100vw - 2rem)); padding: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 30px 90px rgba(0,0,0,0.35); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); animation: authIn 0.65s var(--ease) both; }
    @keyframes authIn { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }
    .auth-header { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.75rem; }
    .auth-header h1 { margin: 0; font-family: var(--font-display); font-size: 2rem; letter-spacing: -0.04em; }
    .auth-header p { margin: 0; color: var(--text-muted); line-height: 1.65; }
    .auth-form { display: grid; gap: 1rem; }
    .input-group { display: grid; gap: 0.45rem; }
    .input-group label { font-size: 0.85rem; color: var(--text-muted); }
    .input-group input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; border-radius: 14px; font: inherit; }
    .input-group input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(108,99,255,0.12); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 5rem; }
    .password-toggle { position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-muted); cursor: pointer; font: inherit; font-size: 0.8rem; }
    .password-toggle:hover { color: var(--text); }
    .auth-feedback { min-height: 1.25rem; color: var(--text-muted); font-size: 0.8rem; }
    .auth-shell.is-busy { opacity: 0.72; pointer-events: none; }
    .auth-buttons { display: grid; gap: 0.85rem; }
    .auth-actions { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .auth-actions button { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 12px 16px; border-radius: 999px; cursor: pointer; transition: all 0.2s var(--ease); }
    .auth-actions button:hover { border-color: var(--accent); transform: translateY(-1px); }
    .hidden { display: none !important; }
  </style>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
</head>

<body>

<main class="auth-shell">

  <div class="auth-header">
    <h1 id="auth-title">Sign in</h1>
  </div>

  <form id="auth-form" class="auth-form">

    <div id="name-field" class="input-group hidden">
      <label>Username</label>
      <input id="name" type="text" placeholder="Username">
    </div>

    <div class="input-group">
      <label>Email address</label>
      <input id="email" type="email" placeholder="you@example.com" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <div class="password-wrap">
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button id="password-toggle" class="password-toggle" type="button" aria-label="Show password">Show</button>
      </div>
    </div>

    <div class="auth-buttons">
      <button type="submit" id="auth-submit" class="btn-primary">Sign in</button>
    </div>

    <div class="auth-actions">
      <span id="mode-text">Don’t have an account?</span>
      <button type="button" id="toggle-mode">Create account</button>
    </div>
    <p id="auth-feedback" class="auth-feedback" role="status" aria-live="polite"></p>

  </form>

</main>

<script type="module">
import { createClient } from "../assets/backend-client.js";
const supabase = createClient();

/* ELEMENTS */
const form = document.getElementById("auth-form");
const title = document.getElementById("auth-title");
const nameField = document.getElementById("name-field");
const toggle = document.getElementById("toggle-mode");
const submitBtn = document.getElementById("auth-submit");
const authShell = document.querySelector(".auth-shell");
const feedback = document.getElementById("auth-feedback");
const passwordToggle = document.getElementById("password-toggle");

const email = document.getElementById("email");
const password = document.getElementById("password");
const nameInput = document.getElementById("name");

let signUpMode = false;

passwordToggle.addEventListener("click", () => {
  const visible = password.type === "text";
  password.type = visible ? "password" : "text";
  passwordToggle.textContent = visible ? "Show" : "Hide";
  passwordToggle.setAttribute("aria-label", visible ? "Show password" : "Hide password");
});

/* REAL-TIME SPACE FILTER STRIPPER */
nameInput.addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\s/g, "");
});

/* SIGN UP */
async function signUp(username, emailVal, passwordVal) {
  if (!username?.trim()) {
    alert("Username is required");
    return false;
  }

  if (/\s/.test(username)) {
    alert("Username cannot contain spaces!");
    return false;
  }

  // Check if the username already exists in the database
  const { data: existingUsers, error: checkError } = await supabase
    .from("users")
    .select("id")
    .eq("username", username.trim())
    .limit(1);

  if (checkError) {
    console.error("Error checking username:", checkError);
    alert("An error occurred while checking username availability. Please try again.");
    return false;
  }

  if (existingUsers && existingUsers.length > 0) {
    alert("This username is already taken! Please choose a different one.");
    return false;
  }

  // Pass username inside raw_user_meta_data for the DB trigger
  const { data, error } = await supabase.auth.signUp({
    email: emailVal,
    password: passwordVal,
    options: {
      data: {
        username: username.trim()
      }
    }
  });

  if (error) {
    alert(error.message);
    return false;
  }

  return true;
}

/* SIGN IN */
async function signIn(emailVal, passwordVal) {
  const { error } = await supabase.auth.signInWithPassword({
    email: emailVal,
    password: passwordVal
  });

  if (error) {
    alert(error.message);
    return false;
  }
  return true;
}

/* TOGGLE MODE */
toggle.addEventListener("click", () => {
  signUpMode = !signUpMode;

  nameField.classList.toggle("hidden", !signUpMode);
  nameInput.required = signUpMode;

  title.textContent = signUpMode ? "Create account" : "Sign in";
  submitBtn.textContent = signUpMode ? "Create account" : "Sign in";

  document.getElementById("mode-text").textContent =
    signUpMode ? "Already have an account?" : "Don't have an account?";

  toggle.textContent = signUpMode ? "Sign in" : "Create account";
});

/* FORM SUBMISSION */
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const emailVal = email.value.trim();
  const passwordVal = password.value.trim();
  const usernameVal = nameInput.value.trim();

  if (!emailVal || !passwordVal) {
    alert("Enter email and password");
    return;
  }

  let ok = false;
  authShell.classList.add("is-busy");
  submitBtn.textContent = signUpMode ? "Creating..." : "Signing in...";
  feedback.textContent = "Checking your details...";

  try {
    if (signUpMode) {
      ok = await signUp(usernameVal, emailVal, passwordVal);
    } else {
      ok = await signIn(emailVal, passwordVal);
    }

    if (ok) {
      window.location.replace("../chat/");
    }
  } catch (error) {
    console.error("Authentication Error:", error);
    alert(error.message);
  } finally {
    authShell.classList.remove("is-busy");
    submitBtn.textContent = signUpMode ? "Create account" : "Sign in";
    if (!ok) feedback.textContent = "Please check your details and try again.";
  }
});

/* AUTH CHECK */
supabase.auth.onAuthStateChange((event, session) => {
  if (session?.user) {
    // Keep user state tracked if needed
  }
});
</script>

</body>
</html>
