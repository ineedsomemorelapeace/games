async function startChat(user) {
  if (!user?.id || chatStartedUserId === user.id) return;
  chatStartedUserId = user.id;

  const input = document.getElementById("message-input");
  const btn = document.getElementById("send-message-btn");
  const scroller = document.getElementById("message-scroller");
  const fileInput = document.getElementById("file-input");
  const uploadBtn = document.getElementById("upload-btn");

  await loadAndCacheAllUsers();
  await loadAvatarIndex();

  listenForNewMessages(user);
  scroller.addEventListener("scroll", handleScrollPagination);
  setupAutocompleteEngine(input);
  
  chatProfilePollInterval = setInterval(async () => {
    if (!currentUser) return;
    const { data: profile, error } = await supabase.from("users").select("bannedUntil, mutedUntil, role").eq("id", currentUser.id).single();
    if (profile && !error) {
      const oldBannedUntil = currentUserBannedUntil;
      const oldMutedUntil = currentUserMutedUntil;
      currentUserBannedUntil = profile.bannedUntil || 0;
      currentUserMutedUntil = profile.mutedUntil || 0;
      currentUserRole = profile.role || "user";
      
      if (currentUserBannedUntil && Date.now() < currentUserBannedUntil) {
        handleBannedUserDisplay();
      } else if (oldBannedUntil && oldBannedUntil > Date.now() && (!currentUserBannedUntil || currentUserBannedUntil <= Date.now())) {
        const inputRow = document.querySelector(".input-row");
        const inputField = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-message-btn");
        if (inputRow) inputRow.style.display = "flex";
        if (inputField) inputField.disabled = false;
        if (sendBtn) sendBtn.disabled = false;
        
        if (currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
          startCooldownTimer(currentUserMutedUntil);
        } else if (activeMuteInterval) {
          clearInterval(activeMuteInterval);
          activeMuteInterval = null;
          const textContainer = document.getElementById("cooldown-timer-text");
          if (textContainer) {
            textContainer.style.display = "none";
            textContainer.textContent = "";
          }
        }
        renderMessages();
      } else if ((!oldMutedUntil || oldMutedUntil <= Date.now()) && currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
        startCooldownTimer(currentUserMutedUntil);
      }
    }
  }, 3000);

  if (uploadBtn && fileInput) {
    uploadBtn.onclick = () => fileInput.click();

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUser) return;

      uploadBtn.disabled = true;

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const filePath = `${currentUser.id}/${fileName}`;

        const { error: uploadError } = await supabase.storage
          .from("chat-files")
          .upload(filePath, file);

        if (uploadError) throw uploadError;

        const { data } = supabase.storage
          .from("chat-files")
          .getPublicUrl(filePath);

        const publicUrl = data.publicUrl;

        const { error: msgError } = await supabase.from("messages").insert([{
          text: publicUrl,
          username: currentUsername,
          userId: currentUser.id,
          avatar: currentUsername ? currentUsername[0].toUpperCase() : "U",
          role: currentUserRole
        }]);

        if (msgError) throw msgError;

      } catch (err) {
        console.error("Upload failed:", err);
        showLocalSystemMessage("File upload failed: " + err.message, true);
      } finally {
        uploadBtn.disabled = false;
        fileInput.value = "";
      }
    };
  }

  btn.onclick = async () => {
    if (currentUserBannedUntil && Date.now() < currentUserBannedUntil) {
      handleBannedUserDisplay();
      return;
    }
    
    let textToSend = input.value.trim();
    if (!textToSend) return;

    if (currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
      startCooldownTimer(currentUserMutedUntil);
      return;
    }

    if (isEditingMode) {
      try {
        const { error } = await supabase
          .from(editingCollectionTarget)
          .update({ text: textToSend })
          .eq("id", editingMessageId);

        if (error) throw error;
      } catch (err) {
        console.error("Error writing message update modification:", err);
      }
      isEditingMode = false;
      editingMessageId = null;
      btn.textContent = "Send";
      input.value = "";
      return;
    }

    const replyMetadata = replyingToMessage ? {
      reply_to_id: replyingToMessage.id,
      reply_to_collection: replyingToMessage.collection,
      reply_to_username: replyingToMessage.username || "User",
      reply_to_text: replyingToMessage.text || ""
    } : {};
    replyingToMessage = null;

    const isAdminPlus = currentUserRole === "admin" || currentUserRole === "owner";
    const now = Date.now();
    if (!isAdminPlus && now - lastMessageTime < MESSAGE_COOLDOWN) return;

    input.value = "";
    lastMessageTime = now;
    requestNotificationPermissionInBackground();
    clearEphemeralSystemMessages();

    if (!isAdminPlus) {
      startCooldownTimer();
    }
    closePopover();

    if (textToSend.startsWith("/")) {
      const segments = textToSend.split(/\s+/);
      const commandKey = segments[0].toLowerCase();
      
      const mentions = textToSend.match(/@[^\s]+/g) || [];
      let targetUsernames = mentions.map(m => m.substring(1).replace(/[.,!?;:]+$/, '').toLowerCase()).filter(Boolean);
      
      let effectiveSegments = [...segments];
      
      if (targetUsernames.length === 0 && segments.length > 1) {
        const firstArg = segments[1];
        const isDuration = /^\d+(s|m|h|d|w|mo|y)$/i.test(firstArg);
        if (!isDuration && firstArg.length > 0) {
          targetUsernames.push(firstArg.replace(/[.,!?;:]+$/, '').toLowerCase());
          effectiveSegments = [segments[0], '@' + firstArg, ...segments.slice(2)];
        }
      }

      const isOwnerOnly = currentUserRole === "owner";

      async function resolveTargetUser() {
        if (targetUsernames.length === 0) return null;
        const searchName = targetUsernames[0];

        let found = localUsersCache.find(u => u.username && u.username.toLowerCase() === searchName);
        if (found) return found;

        const { data } = await supabase
          .from("users")
          .select("id, username, role")
          .ilike("username", searchName)
          .maybeSingle();

        return data || null;
      }

      function checkRoleHierarchy(target) {
        if (!target) return false;
        if (target.id === currentUser.id) {
          showLocalSystemMessage("You cannot perform this action on yourself.", true);
          return false;
        }
        if (target.role === "owner" && currentUserRole !== "owner") {
          showLocalSystemMessage("You cannot perform this action on an Owner.", true);
          return false;
        }
        if (target.role === "admin" && currentUserRole === "admin") {
          showLocalSystemMessage("You cannot perform this action on another Admin.", true);
          return false;
        }
        return true;
      }

      if (commandKey === "/publicvc") {
        const roomId = "vc-pub-" + Math.random().toString(36).substring(2, 9);
        await supabase.from("vc_rooms").insert([{ room_id: roomId, created_by: currentUsername, is_public: true }]);
        await supabase.from("messages").insert([{
          text: `@${currentUsername} started a public voice chat!`,
          username: "Server",
          userId: null,
          role: "system",
          type: "vc_invite",
          room_id: roomId
        }]);
        joinVoiceRoom(roomId);
        return;
      }

      if (commandKey === "/privatevc") {
        const mentionsPrivate = textToSend.match(/@[^\s]+/g) || [];
        let targetUsernamesPrivate = mentionsPrivate.map(m => m.replace("@", "").replace(/[.,!?;:]+$/, '').toLowerCase()).filter(Boolean);
        
        if (targetUsernamesPrivate.length === 0) {
          let i = 1;
          while (i < segments.length && segments[i].length > 0) {
            targetUsernamesPrivate.push(segments[i].replace(/[.,!?;:]+$/, '').toLowerCase());
            i++;
          }
        }

        if (targetUsernamesPrivate.length === 0) {
          showLocalSystemMessage("Syntax: /privatevc @username1 @username2", true);
          return;
        }

        const roomId = "vc-priv-" + Math.random().toString(36).substring(2, 9);
        const invitedList = [currentUsername, ...targetUsernamesPrivate].join(", ");

        const participantIds = [currentUser.id];
        for (const uname of targetUsernamesPrivate) {
            const u = localUsersCache.find(x => x.username.toLowerCase() === uname);
            if (u) participantIds.push(u.id);
        }

        await supabase.from("vc_rooms").insert([{
          room_id: roomId,
          created_by: currentUsername,
          is_public: false,
          allowed_users: [currentUsername.toLowerCase(), ...targetUsernamesPrivate]
        }]);

        await supabase.from("whispers").insert([{
          text: `@${currentUsername} started a private voice chat including: ${invitedList}`,
          username: "Server",
          senderId: currentUser.id,
          participants: participantIds,
          type: "vc_invite",
          room_id: roomId,
          role: "system"
        }]);

        joinVoiceRoom(roomId);
        return;
      }

      if (commandKey === "/mute" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        const durationStr = effectiveSegments[2];
        const durationMs = parseDurationString(durationStr);

        if (!targetUser || !durationMs) {
          showLocalSystemMessage("Syntax: /mute @username [time, e.g., 45s/30m/4h]", true);
          return;
        }
        if (!checkRoleHierarchy(targetUser)) return;

        const { error } = await supabase.from("users").update({ "mutedUntil": Date.now() + durationMs }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to mute user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Muted user @${targetUser.username} for ${durationStr}.`, false);
        return;
      }

      if (commandKey === "/unmute" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unmute @username", true); return; }
        const { error } = await supabase.from("users").update({ "mutedUntil": 0 }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to unmute user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Unmuted user @${targetUser.username}.`, false);
        return;
      }

      if (commandKey === "/ban" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        const durationStr = effectiveSegments[2];
        const durationMs = parseDurationString(durationStr);
        const reason = effectiveSegments.slice(3).join(" ") || "No explicit reason logged.";

        if (!targetUser || !durationMs) {
          showLocalSystemMessage("Syntax: /ban @username [time, e.g., 10s/2h/15d] [reason]", true);
          return;
        }
        if (!checkRoleHierarchy(targetUser)) return;

        const banTimestamp = Date.now() + durationMs;
        const { error } = await supabase.from("users").update({ "bannedUntil": banTimestamp, "banReason": reason }).eq("id", targetUser.id);

        if (error) { showLocalSystemMessage(`Failed to ban user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Successfully banned @${targetUser.username} for ${durationStr}. Reason: ${reason}`, false);
        return;
      }

      if (commandKey === "/unban" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unban @username", true); return; }
        const { error } = await supabase.from("users").update({ "bannedUntil": 0, "banReason": null }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to unban user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Lifted ban from user @${targetUser.username}.`, false);
        return;
      }

      if (commandKey === "/permaban" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /permaban @username [reason]", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;

        const reason = effectiveSegments.slice(2).join(" ") || "No explicit reason logged.";
        const permaTimestamp = Date.now() + (100 * 365 * 24 * 60 * 60 * 1000);

        const { error } = await supabase.from("users").update({ "bannedUntil": permaTimestamp, "banReason": reason }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to permaban user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Permanently banned @${targetUser.username}. Reason: ${reason}`, false);
        return;
      }

      if (commandKey === "/kick" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /kick @username [reason]", true); return; }
        if (!checkRoleHierarchy(targetUser)) return;

        const reason = effectiveSegments.slice(2).join(" ") || "No explicit reason logged.";
        const kickTimestamp = Date.now() + (2 * 60 * 1000);

        const { error } = await supabase.from("users").update({ "bannedUntil": kickTimestamp, "banReason": reason }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to kick user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Kicked user @${targetUser.username} for 2 minutes. Reason: ${reason}`, false);
        return;
      }

      if (commandKey === "/admin" && isOwnerOnly) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /admin @username", true); return; }
        const { error } = await supabase.from("users").update({ role: "admin" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to promote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Promoted @${targetUser.username} to Admin.`, false);
        return;
      }

      if (commandKey === "/unadmin" && isOwnerOnly) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unadmin @username", true); return; }
        const { error } = await supabase.from("users").update({ role: "user" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to demote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Demoted @${targetUser.username} to standard User level.`, false);
        return;
      }

      if (commandKey === "/owner" && isOwnerOnly) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /owner @username", true); return; }
        const { error } = await supabase.from("users").update({ role: "owner" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to promote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Promoted @${targetUser.username} to Owner privileges.`, false);
        return;
      }

      if (commandKey === "/unowner" && isOwnerOnly) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /unowner @username", true); return; }
        const { error } = await supabase.from("users").update({ role: "admin" }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to demote user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Demoted @${targetUser.username} to Admin.`, false);
        return;
      }

      if (commandKey === "/subscription" && isOwnerOnly) {
        const targetUser = await resolveTargetUser();
        const chosenRank = effectiveSegments[2]?.toLowerCase();
        if (!targetUser || (chosenRank !== "basic" && chosenRank !== "premium")) { showLocalSystemMessage("Syntax: /subscription @username basic/premium", true); return; }
        const { error } = await supabase.from("users").update({ rank: chosenRank }).eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to update subscription: ${error.message}`, true); return; }
        showLocalSystemMessage(`Updated subscription parameters for @${targetUser.username} to [${chosenRank}].`, false);
        await loadAndCacheAllUsers();
        return;
      }

      if (commandKey === "/deleteuser" && isOwnerOnly) {
        const targetUser = await resolveTargetUser();
        if (!targetUser) { showLocalSystemMessage("Syntax: /deleteuser @username", true); return; }
        const { error } = await supabase.from("users").delete().eq("id", targetUser.id);
        if (error) { showLocalSystemMessage(`Failed to delete user: ${error.message}`, true); return; }
        showLocalSystemMessage(`Purged user database records for user identity: @${targetUser.username}.`, false);
        await loadAndCacheAllUsers();
        return;
      }

      if (commandKey === "/deleteall" && isAdminPlus) {
        await supabase.from("messages").delete().not('id', 'is', null);
        await supabase.from("whispers").delete().not('id', 'is', null);
        showLocalSystemMessage("Database messages and whispers wiped.", false);
        return;
      }

      if (commandKey === "/warn" && isAdminPlus) {
        const targetUser = await resolveTargetUser();
        const reason = effectiveSegments.slice(2).join(" ");
        if (!targetUser || !reason) { showLocalSystemMessage("Syntax: /warn @username [reason]", true); return; }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayTimestamp = today.toISOString();
        
        let warnCount = 1;
        try {
            const { data: warnsToday } = await supabase
                .from("whispers")
                .select("id")
                .contains("participants", [targetUser.id])
                .gte("timestamp", todayTimestamp)
                .ilike("text", "Warning %");
            if (warnsToday) warnCount = warnsToday.length + 1;
        } catch(e) { console.warn("Could not fetch warn count", e); }

        const warnText = `Warning ${warnCount}: ${reason}`;
        
        await supabase.from("whispers").insert([{
            text: warnText,
            username: "Server",
            senderId: currentUser.id,
            participants: [currentUser.id, targetUser.id],
            role: "system"
        }]);
        
        showLocalSystemMessage(`Issued warning ${warnCount} to @${targetUser.username}.`, false);
        return;
      }

      if (commandKey === "/undo") {
        if (!lastActionLog) { showLocalSystemMessage("No valid local environment modifications recorded.", true); return; }
        try {
          if (lastActionLog.type === "delete") {
            await supabase.from(lastActionLog.collection).insert([lastActionLog.data]);
            showLocalSystemMessage("Undo Executed: Restored deleted record.");
          } else if (lastActionLog.type === "edit") {
            await supabase.from(lastActionLog.collection).update({ text: lastActionLog.data.text }).eq("id", lastActionLog.id);
            showLocalSystemMessage("Undo Executed: Reverted text modifications.");
          }
          lastActionLog = null;
        } catch(err) {
          showLocalSystemMessage("Failed to restore record.", true);
        }
        return;
      }

      if (!["/w", "/whisper", "/omoggle", "/publicvc", "/privatevc"].includes(commandKey)) {
        showLocalSystemMessage(`System Warning: Command '${commandKey}' is unrecognized or unauthorized.`, true);
        return;
      }
    }

    const segments = textToSend.split(/\s+/);
    const primaryCommandKey = segments[0].toLowerCase();
    const isWhisperCommand = primaryCommandKey === "/w" || primaryCommandKey === "/whisper";
    const isOmoggleCommand = primaryCommandKey === "/omoggle";
    let targetUsernames = [];
    let parsedText = textToSend;

    if (isWhisperCommand || isOmoggleCommand) {
      let i = 1;
      while (i < segments.length) {
        let token = segments[i];
        if (token.startsWith("@")) {
          targetUsernames.push(token.substring(1).replace(/[.,!?;:]+$/, '').toLowerCase());
          i++;
        } else if (targetUsernames.length === 0) {
          targetUsernames.push(token.toLowerCase().replace(/[.,!?;:]+$/, ''));
          i++;
        } else {
          break;
        }
      }
      parsedText = segments.slice(i).join(" ");
    }

    const clientSideId = "msg-" + Date.now() + Math.random().toString(36).substring(2);

    const pendingMsgData = {
      text: isOmoggleCommand && !parsedText ? "Do you want to duel in Omoggle?" : parsedText,
      username: currentUsername,
      userId: user.id,
      senderId: user.id,
      avatar: currentUsername && currentUsername.length > 0 ? currentUsername[0].toUpperCase() : "U",
      timestamp: null,
      isPending: true,
      isWhisper: targetUsernames.length > 0,
      isOmoggleInvite: isOmoggleCommand,
      inviteStatus: isOmoggleCommand ? "pending" : null,
      isSystemMessage: isOmoggleCommand,
      role: currentUserRole,
      clientSideId: clientSideId
    };

    localPendingQueue.push(pendingMsgData);
    renderMessages(true);

    try {
      if (targetUsernames.length > 0) {
        let participantIds = [user.id];

        targetUsernames.forEach(uname => {
          const matchedUser = localUsersCache.find(u => u.username.toLowerCase() === uname);
          if (matchedUser && !participantIds.includes(matchedUser.id)) {
            participantIds.push(matchedUser.id);
          }
        });

        if (participantIds.length === 1) {
          throw new Error("No valid recipients found with those usernames in your local cache maps.");
        }

        const challengePayload = {
          text: isOmoggleCommand && !parsedText ? "Do you want to duel in Omoggle?" : parsedText,
          username: currentUsername,
          senderId: user.id,
          avatar: currentUsername && currentUsername.length > 0 ? currentUsername[0].toUpperCase() : "U",
          participants: participantIds,
          role: currentUserRole,
          clientSideId: clientSideId,
          ...replyMetadata
        };

        if (isOmoggleCommand) {
          challengePayload.isOmoggleInvite = true;
          challengePayload.inviteStatus = "pending";
        }

        const { error } = await supabase.from("whispers").insert([challengePayload]);
        if (error) throw error;
      } else {
        const { error } = await supabase.from("messages").insert([{
          text: textToSend,
          username: currentUsername,
          userId: user.id,
          avatar: currentUsername && currentUsername.length > 0 ? currentUsername[0].toUpperCase() : "U",
          role: currentUserRole,
          clientSideId: clientSideId,
          ...replyMetadata
        }]);
        if (error) throw error;
      }
    } catch (err) {
      console.error("Error sending message:", err);
      showLocalSystemMessage(err.message || "Failed to deliver message payload channels.", true);
      localPendingQueue = localPendingQueue.filter(m => m.clientSideId !== clientSideId);
      renderMessages();
    }
  };
}

function updateAutocompleteCacheFromLoadedMessages() {
  const uniqueUsers = new Map();

  allRegisteredUsers.forEach(user => {
    uniqueUsers.set(user.id, user);
  });

  let allMessages = [...dbHistoricalMessages, ...dbPublicMessages, ...dbPrivateMessages];
  allMessages.forEach(msg => {
    if (msg.userId && msg.username) {
      uniqueUsers.set(msg.userId, {
        id: msg.userId,
        username: msg.username,
        avatar: msg.avatar || msg.username[0].toUpperCase()
      });
    } else if (msg.senderId && msg.username) {
      uniqueUsers.set(msg.senderId, {
        id: msg.senderId,
        username: msg.username,
        avatar: msg.avatar || msg.username[0].toUpperCase()
      });
    }
  });

  localUsersCache = Array.from(uniqueUsers.values());
}

async function listenForNewMessages(user) {
  const { data: initialPublic } = await supabase
    .from("messages")
    .select("*")
    .order("timestamp", { ascending: false })
    .range(0, MESSAGE_PAGE_SIZE - 1);

  if (initialPublic) {
    dbPublicMessages = initialPublic.map(m => ({ ...m, isWhisper: false, isSystemMessage: m.role === "system" })).reverse();
    initialSnapshotReceived = true;
    if (initialPublic.length < MESSAGE_PAGE_SIZE) allMessagesLoaded = true;
    historyPageOffset = dbPublicMessages.length;
    renderMessages();
  }

  const { data: initialPrivate } = await supabase
    .from("whispers")
    .select("*")
    .contains("participants", [user.id]);

  if (initialPrivate) {
    dbPrivateMessages = initialPrivate.map(m => ({ ...m, isWhisper: true, isSystemMessage: m.isOmoggleInvite === true }));
    renderMessages();
  }

  await removeSupabaseChannel(publicChannel);
  publicChannel = null;
  publicChannel = supabase
    .channel('public:messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const newMsg = { ...payload.new, isWhisper: false, isSystemMessage: payload.new.role === "system" };
      maybeNotifyForMention(newMsg);
      dbPublicMessages.push(newMsg);
      renderMessages(true);
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
      dbPublicMessages = dbPublicMessages.filter(m => m.id !== payload.old.id);
      dbHistoricalMessages = dbHistoricalMessages.filter(m => m.id !== payload.old.id);
      renderMessages();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {
      const idx = dbPublicMessages.findIndex(m => m.id === payload.new.id);
      if (idx !== -1) dbPublicMessages[idx] = { ...payload.new, isWhisper: false, isSystemMessage: payload.new.role === "system" };
      const hIdx = dbHistoricalMessages.findIndex(m => m.id === payload.new.id);
      if (hIdx !== -1) dbHistoricalMessages[hIdx] = { ...payload.new, isWhisper: false, isSystemMessage: payload.new.role === "system" };
      renderMessages();
    })
    .subscribe();

  await removeSupabaseChannel(privateChannel);
  privateChannel = null;
  privateChannel = supabase
    .channel('public:whispers')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'whispers' }, payload => {
      const newWhisper = payload.new;
      if (newWhisper.participants && newWhisper.participants.includes(user.id)) {
        const incomingMessage = { ...newWhisper, isWhisper: true, isSystemMessage: newWhisper.isOmoggleInvite === true || newWhisper.type === 'vc_invite' || newWhisper.role === 'system' };
        maybeNotifyForMention(incomingMessage);
        dbPrivateMessages.push(incomingMessage);
        renderMessages(true);
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'whispers' }, payload => {
      const updatedWhisper = payload.new;
      if (updatedWhisper.participants && updatedWhisper.participants.includes(user.id)) {
        const idx = dbPrivateMessages.findIndex(m => m.id === updatedWhisper.id);
        if (idx !== -1) {
          dbPrivateMessages[idx] = { ...updatedWhisper, isWhisper: true, isSystemMessage: updatedWhisper.isOmoggleInvite === true || updatedWhisper.type === 'vc_invite' || updatedWhisper.role === 'system' };

          if (updatedWhisper.isOmoggleInvite && updatedWhisper.inviteStatus === "accepted") {
            const sessionRedirectToken = `omoggle_redirected_${updatedWhisper.id}`;
            if (!processedOmoggleRedirects.has(updatedWhisper.id)) {
              processedOmoggleRedirects.add(updatedWhisper.id);
              sessionStorage.setItem(sessionRedirectToken, "true");

              const roleIdentityString = user.id === updatedWhisper.senderId ? "host" : "guest";
              setTimeout(() => {
                if (window.location.pathname.includes('/omoggle/')) return;
                window.location.href = `../omoggle/?room=${updatedWhisper.id}&role=${roleIdentityString}&hostName=${encodeURIComponent(updatedWhisper.username)}`;
              }, 800);
            }
          }
          renderMessages();
        }
      }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'whispers' }, payload => {
      dbPrivateMessages = dbPrivateMessages.filter(m => m.id !== payload.old.id);
      renderMessages();
    })
    .subscribe();
}

async function jumpToMessage(collection, messageId) {
  if (!collection || messageId === null || messageId === undefined) return;
  const selector = (value) => {
    const escaped = window.CSS && CSS.escape ? CSS.escape(String(value)) : String(value).replace(/[^a-zA-Z0-9_-]/g, "\\function renderMessages(forceScrollDown = false) {");
    return `[data-message-collection="${collection}"][data-message-id="${escaped}"]`;
  };

  let target = document.querySelector(selector(messageId));
  if (!target) {
    try {
      const { data, error } = await supabase.from(collection).select("*").eq("id", messageId).maybeSingle();
      if (!error && data) {
        const normalized = {
          ...data,
          isWhisper: collection === "whispers",
          isSystemMessage: collection === "messages" ? data.role === "system" : (data.isOmoggleInvite === true || data.type === "vc_invite" || data.role === "system")
        };
        const list = collection === "messages" ? dbHistoricalMessages : dbPrivateMessages;
        if (!list.some(m => m.id === normalized.id)) list.push(normalized);
        renderMessages();
        target = document.querySelector(selector(messageId));
      }
    } catch (error) {
      console.warn("Could not load referenced message:", error);
    }
  }

  if (!target) {
    showLocalSystemMessage("That message could not be found.", true);
    return;
  }

  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.remove("msg-jump-highlight");
  void target.offsetWidth;
  target.classList.add("msg-jump-highlight");
  setTimeout(() => target.classList.remove("msg-jump-highlight"), 1800);
}

function setReplyTarget(msgData, collection) {
  if (!msgData || msgData.id === undefined || msgData.id === null) return;
  if (replyingToMessage && replyingToMessage.id === msgData.id && replyingToMessage.collection === collection) {
    replyingToMessage = null;
    const input = document.getElementById("message-input");
    if (input) input.focus();
    return;
  }
  replyingToMessage = { id: msgData.id, collection, username: msgData.username || "User", text: msgData.text || "" };
  const input = document.getElementById("message-input");
  if (input) {
    input.placeholder = `Reply to @${replyingToMessage.username}...`;
    input.focus();
  }
}

async function forwardMessage(msgData, collection) {
  if (!msgData || msgData.id === undefined || msgData.id === null || !currentUser) return;
  if (msgData.isSystemMessage || msgData.isOmoggleInvite) {
    showLocalSystemMessage("This message cannot be forwarded.", true);
    return;
  }
  if (currentUserMutedUntil && Date.now() < currentUserMutedUntil) {
    startCooldownTimer(currentUserMutedUntil);
    return;
  }
  const isAdminPlus = currentUserRole === "admin" || currentUserRole === "owner";
  const now = Date.now();
  if (!isAdminPlus && now - lastMessageTime < MESSAGE_COOLDOWN) return;

  const clientSideId = "msg-" + Date.now() + Math.random().toString(36).substring(2);
  const base = {
    text: msgData.text || "",
    username: currentUsername,
    avatar: currentUsername ? currentUsername[0].toUpperCase() : "U",
    role: currentUserRole,
    clientSideId,
    forward_of_id: msgData.id,
    forward_of_collection: collection,
    forward_of_username: msgData.username || "User",
    forward_of_text: msgData.text || ""
  };

  try {
    if (collection === "whispers") {
      const participants = Array.isArray(msgData.participants) && msgData.participants.length > 0 ? msgData.participants : [currentUser.id];
      const { error } = await supabase.from("whispers").insert([{
        ...base, senderId: currentUser.id, participants, isWhisper: true, isSystemMessage: false
      }]);
      if (error) throw error;
    } else {
      const { error } = await supabase.from("messages").insert([{ ...base, userId: currentUser.id }]);
      if (error) throw error;
    }
    lastMessageTime = now;
    if (!isAdminPlus) startCooldownTimer();
  } catch (error) {
    console.error("Failed to forward message:", error);
    showLocalSystemMessage(error.message || "Failed to forward message.", true);
  }
}

function renderMessages(forceScrollDown = false) {
  if (currentUserBannedUntil && Date.now() < currentUserBannedUntil) {
    handleBannedUserDisplay();
    return;
  }

  const scroller = document.getElementById("message-scroller");
  if (!scroller) return;

  const isPinnedToBottom = scroller.scrollHeight - scroller.clientHeight <= scroller.scrollTop + 30;
  const cachedScrollTop = scroller.scrollTop;

  updateAutocompleteCacheFromLoadedMessages();
  scroller.innerHTML = "";

  if (allMessagesLoaded) {
    const banner = document.createElement("div");
    banner.style.cssText = "text-align: center; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; padding: 10px 0; width: 100%; margin-bottom: 0.5rem;";
    banner.textContent = "All messages loaded";
    scroller.appendChild(banner);
  }

  const regularMessages = [...dbHistoricalMessages, ...dbPublicMessages, ...dbPrivateMessages];
  const hasRegularMessages = regularMessages.some(msg => !msg.isSystemMessage) || localPendingQueue.some(msg => !msg.isSystemMessage);
  const visibleEphemeralMessages = hasRegularMessages ? [] : ephemeralSystemMessages;
  let allMessages = [...visibleEphemeralMessages, ...regularMessages];

  const seenIds = new Set();
  allMessages = allMessages.filter(msg => {
    const msgId = msg.id || msg.clientSideId;
    if (!msgId) return true;
    if (seenIds.has(msgId)) return false;
    seenIds.add(msgId);
    return true;
  });

  allMessages.sort((a, b) => {
    const timeA = a.timestamp ? new Date(a.timestamp).getTime() : Date.now();
    const timeB = b.timestamp ? new Date(b.timestamp).getTime() : Date.now();
    return timeA - timeB;
  });

  const confirmedDbClientIds = new Set(allMessages.map(m => m.clientSideId).filter(Boolean));
  localPendingQueue = localPendingQueue.filter(m => !confirmedDbClientIds.has(m.clientSideId));

  allMessages.forEach(msg => displayMessage(scroller, msg));
  localPendingQueue.forEach(pendingMsg => displayMessage(scroller, pendingMsg));

  if (isFirstLoad && dbPublicMessages.length > 0) {
    scroller.scrollTop = scroller.scrollHeight;
    isFirstLoad = false;
  } else if (isPinnedToBottom || forceScrollDown) {
    scroller.scrollTop = scroller.scrollHeight;
  } else {
    scroller.scrollTop = cachedScrollTop;
  }
}

    div.dataset.messageCollection = dataCollectionTargetStr;

  const time = msgData.timestamp ? new Date(msgData.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "Sending...";

  const safeUsername = msgData.username || "User";
  const avatarLetter = safeUsername.length > 0 ? safeUsername[0].toUpperCase() : "U";

  let textContent = "";
  const rawText = msgData.text || "";

  const isImage = (/\.(jpg|jpeg|png|webp|gif|svg)($|\?)/i.test(rawText)) || (rawText.includes('/storage/v1/object/public/') && /\.(jpg|jpeg|png|webp|gif|svg)/i.test(rawText));
  const isVideo = (/\.(mp4|webm|mov)($|\?)/i.test(rawText));
  const isAudio = (/\.(mp3|wav|ogg)($|\?)/i.test(rawText));

  if (isImage) {
    const fileName = rawText.split('/').pop().split('?')[0];
    textContent = `
      <div style="margin-top: 6px;">
        <img src="${escapeHtml(rawText)}" alt="Uploaded File" crossorigin="anonymous" style="max-width: 100%; max-height: 320px; border-radius: 8px; display: block; background: #181b33; object-fit: contain;" onerror="this.onerror=null; this.parentElement.innerHTML='<a href=\'${escapeHtml(rawText)}\' target=\'_blank\' download style=\'display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); padding: 8px 12px; border-radius: 6px; color: #3b82f6; text-decoration: none; font-weight: 600;\'>Download ${escapeHtml(fileName)}</a>';" />
      </div>
    `;
  } else if (isVideo) {
    textContent = `<video controls playsinline webkit-playsinline src="${escapeHtml(rawText)}" style="max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 6px;"></video>`;
  } else if (isAudio) {
    textContent = `<audio controls src="${escapeHtml(rawText)}" style="margin-top: 6px; max-width: 100%;"></audio>`;
  } else if (rawText.startsWith("https://") && rawText.includes("/storage/v1/object/public/")) {
    const fileName = rawText.split('/').pop().split('?')[0];
    textContent = `<a href="${escapeHtml(rawText)}" target="_blank" download style="display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); padding: 8px 12px; border-radius: 6px; color: #3b82f6; text-decoration: none; font-weight: 600; margin-top: 4px;">Download ${escapeHtml(fileName)}</a>`;
  } else {
    textContent = escapeHtml(rawText).replace(/@([^\s]+)/g, (match, p1) => {
      const cleanName = p1.replace(/[.,!?;:]+$/, '');
      const trailing = p1.slice(cleanName.length);
      return `<span style="color: #3b82f6; background: rgba(59,130,246,0.15); padding: 1px 5px; border-radius: 4px; font-weight: 600; border: 1px solid rgba(59,130,246,0.2);">@${cleanName}</span>${trailing}`;
    });
  }

  let layoutStructuralString = "";

  if (msgData.isOmoggleInvite) {
    let internalDuelPanelHTML = "";
    let inviteContextLineText = "";
    const userIsChallengeSender = currentUser && (currentUser.id === msgData.senderId || currentUser.id === msgData.userId);

    if (msgData.inviteStatus === "pending") {
      if (!userIsChallengeSender) {
        inviteContextLineText = `<p style="color:#6c63ff; font-weight:600;">@${safeUsername} sent you a duel request on Omoggle!</p>`;
        internalDuelPanelHTML = `
          <div class="duel-card">
            <span class="duel-card-msg">Do you want to duel in Omoggle?</span>
            <div class="duel-card-actions">
              <button class="btn-duel-accept">Accept</button>
              <button class="btn-duel-decline">Decline</button>
            </div>
          </div>
        `;
      } else {
        inviteContextLineText = `<p style="color:#6c63ff; font-weight:600;">Sent Omoggle duel request to your opponent (Pending...)</p>`;
        internalDuelPanelHTML = "";
      }
    } else if (msgData.inviteStatus === "accepted") {
      inviteContextLineText = `<p style="color:#10b981; font-weight:600;">Omoggle duel match accepted!</p>`;
      internalDuelPanelHTML = `<div class="duel-card" style="border-color:#10b981;"><span class="duel-card-msg" style="color:#10b981;">Duel accepted! Redirecting...</span></div>`;
    } else {
      inviteContextLineText = `<p style="color:#ef4444; font-weight:600;">Omoggle challenge update</p>`;
      internalDuelPanelHTML = `<div class="duel-card" style="border-color:#ef4444;"><span class="duel-card-msg" style="color:#ef4444;">Challenge declined.</span></div>`;
    }

    layoutStructuralString = `
      <div class="msg-avatar" style="background: #242549; color: #fff;">S</div>
      <div class="msg-content">
        <div class="msg-top">
          <h5>Server <span>${time}</span></h5>
        </div>
        ${inviteContextLineText}
        ${internalDuelPanelHTML}
      </div>
    `;
  } else if (msgData.type === "vc_invite" || msgData.isSystemMessage) {
    let vcButtonsHTML = "";
    
    if (msgData.type === "vc_invite" && msgData.room_id && msgData.text !== "This call has ended.") {
      vcButtonsHTML = `
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button class="btn-duel-accept" onclick="window.joinVoiceRoom('${msgData.room_id}')">Join Voice</button>
          <button class="btn-duel-decline" onclick="this.closest('.msg-block').remove()">Dismiss</button>
        </div>
      `;
    }

    const isVC = msgData.type === "vc_invite";
    const avatarIcon = isVC ? "VC" : "S";
    const headerTitle = isVC ? "Voice Chat" : "Server";
    const textColor = isVC ? "var(--accent)" : (msgData.isError ? "#ef4444" : "#6c63ff");

    layoutStructuralString = `
      <div class="msg-avatar" style="background: #242549; color: #fff;">${avatarIcon}</div>
      <div class="msg-content">
        <div class="msg-top">
          <h5>${headerTitle} <span>${time}</span></h5>
        </div>
        <p style="color: ${textColor}; font-weight: 600;">${escapeHtml(msgData.text || "")}</p>
        ${vcButtonsHTML}
      </div>
    `;
  } else {
    let staticControlsTrayHTML = "";
    const replyPreviewHTML = msgData.reply_to_id !== null && msgData.reply_to_id !== undefined ? `
      <div class="msg-reply-preview" data-jump-collection="${escapeHtml(msgData.reply_to_collection || "messages")}" data-jump-id="${escapeHtml(String(msgData.reply_to_id))}" title="Jump to replied message">
        <span class="reply-author">↪ ${escapeHtml(msgData.reply_to_username || "User")}</span>
        <span class="reply-text">${escapeHtml(msgData.reply_to_text || "Message")}</span>
      </div>
    ` : "";
    const forwardPreviewHTML = msgData.forward_of_id !== null && msgData.forward_of_id !== undefined ? `
      <div class="msg-forward-preview" data-jump-collection="${escapeHtml(msgData.forward_of_collection || "messages")}" data-jump-id="${escapeHtml(String(msgData.forward_of_id))}" title="Jump to forwarded message">
        <span class="forward-label">Forwarded</span>
        <span class="forward-text">${escapeHtml(msgData.forward_of_text || msgData.text || "Message")}</span>
      </div>
    ` : "";
    if (msgData.id !== undefined && msgData.id !== null) {
      const canModify = currentUser && (currentUser.id === msgData.userId || currentUser.id === msgData.senderId || currentUserRole === "admin" || currentUserRole === "owner");
      staticControlsTrayHTML = `
        <div class="msg-controls-tray">
          <button class="action-control-btn btn-reply-msg" title="Reply">
            <img src="../assets/chat-reply.svg" alt="Reply" class="tray-icon-img">
          </button>
          <button class="action-control-btn btn-forward-msg" title="Forward">
            <img src="../assets/chat-forward.svg" alt="Forward" class="tray-icon-img">
          </button>
          ${canModify ? `<button class="action-control-btn btn-edit-msg" title="Modify Context">
            <img src="../assets/chat-pencil.svg" alt="Edit" class="tray-icon-img">
          </button>
          <button class="action-control-btn btn-delete-msg" title="Purge Record">
            <img src="../assets/chat-trash.svg" alt="Delete" class="tray-icon-img">
          </button>` : ""}
        </div>
      `;
    }

    layoutStructuralString = `
      <div class="msg-avatar"></div>
      <div class="msg-content">
        ${replyPreviewHTML}
        ${forwardPreviewHTML}
        <div class="msg-top">
          <h5>${safeUsername} <span>${time}</span> ${statusBadgeHTML} ${whisperTag}</h5>
        </div>
        <p>${textContent}</p>
      </div>
      ${staticControlsTrayHTML}
    `;
  }

  div.innerHTML = layoutStructuralString;

  if (!msgData.isSystemMessage && !msgData.isOmoggleInvite) {
    decorateAvatarElement(div.querySelector('.msg-avatar'), msgData.userId || msgData.senderId, safeUsername, avatarLetter);
  }
  if (msgData.isOmoggleInvite && msgData.inviteStatus === "pending" && currentUser && currentUser.id !== msgData.senderId) {
    const accBtn = div.querySelector(".btn-duel-accept");
    const decBtn = div.querySelector(".btn-duel-decline");
    
    if (accBtn) {
      accBtn.onclick = async (e) => {
        e.stopPropagation();
        accBtn.disabled = true;
        if (decBtn) decBtn.disabled = true;
        const { error } = await supabase.from("whispers").update({ inviteStatus: "accepted" }).eq("id", msgData.id);
        if (error) {
          console.error("Accept error:", error);
          showLocalSystemMessage("Failed to accept duel.", true);
          accBtn.disabled = false;
          if (decBtn) decBtn.disabled = false;
        }
      };
    }
    
    if (decBtn) {
      decBtn.onclick = async (e) => {
        e.stopPropagation();
        decBtn.disabled = true;
        if (accBtn) accBtn.disabled = true;
        const { error } = await supabase.from("whispers").update({ inviteStatus: "declined" }).eq("id", msgData.id);
        if (error) {
          console.error("Decline error:", error);
          showLocalSystemMessage("Failed to decline duel.", true);
          decBtn.disabled = false;
          if (accBtn) accBtn.disabled = false;
        }
      };
    }
  }

  const replyBtn = div.querySelector(".btn-reply-msg");
  const forwardBtn = div.querySelector(".btn-forward-msg");
  const editBtn = div.querySelector(".btn-edit-msg");
  const deleteBtn = div.querySelector(".btn-delete-msg");

  if (replyBtn) {
    replyBtn.onclick = (e) => {
      e.stopPropagation();
      setReplyTarget(msgData, dataCollectionTargetStr);
    };
  }

  if (forwardBtn) {
    forwardBtn.onclick = async (e) => {
      e.stopPropagation();
      await forwardMessage(msgData, dataCollectionTargetStr);
    };
  }

  div.querySelectorAll(".msg-reply-preview, .msg-forward-preview").forEach(preview => {
    preview.addEventListener("click", (e) => {
      e.stopPropagation();
      jumpToMessage(preview.dataset.jumpCollection, preview.dataset.jumpId);
    });
  });

  if (editBtn) {
    editBtn.onclick = () => {
      const messageInput = document.getElementById("message-input");
      const sendButtonElement = document.getElementById("send-message-btn");

      isEditingMode = true;
      editingMessageId = msgData.id;
      editingCollectionTarget = dataCollectionTargetStr;

      messageInput.value = msgData.text;
      sendButtonElement.textContent = "Edit";

      messageInput.focus();
      messageInput.selectionStart = messageInput.selectionEnd = messageInput.value.length;
    };
  }

  if (deleteBtn) {
    deleteBtn.onclick = async () => {
      try {
        const { data: record } = await supabase.from(dataCollectionTargetStr).select("*").eq("id", msgData.id).single();
        if (record) {
          lastActionLog = { type: "delete", collection: dataCollectionTargetStr, id: msgData.id, data: record };
        }
        await supabase.from(dataCollectionTargetStr).delete().eq("id", msgData.id);
      } catch(err) {
        console.error("Failed to process document purge lifecycle steps:", err);
      }
    };
  }

  scroller.appendChild(div);
}

function getMentionSuggestionItems(searchStr = "") {
  const normalizedSearch = (searchStr || "").toLowerCase();
  const isAdminPlus = currentUserRole === "admin" || currentUserRole === "owner";
  const specialItems = [
    { username: "mod", avatar: "@", isSpecial: true },
    ...(isAdminPlus ? [
      { username: "everyone", avatar: "@", isSpecial: true },
      { username: "here", avatar: "@", isSpecial: true }
    ] : [])
  ].filter(item => item.username.startsWith(normalizedSearch));

  const filteredUsers = localUsersCache
    .filter(u => u.username.toLowerCase().startsWith(normalizedSearch) && u.username.toLowerCase() !== currentUsername.toLowerCase())
    .map(u => ({ ...u, isSpecial: false }));

  return [...specialItems, ...filteredUsers];
}

function attachTapOrScrollHandler(element, callback) {
  let startX = 0;
  let startY = 0;

  element.addEventListener("pointerdown", (e) => {
    startX = e.clientX;
    startY = e.clientY;
  });

  element.addEventListener("pointerup", (e) => {
    const endX = e.clientX;
    const endY = e.clientY;
    const distance = Math.hypot(endX - startX, endY - startY);

    if (distance <= 4) {
      callback(e);
    }
  });
}

function setupAutocompleteEngine(input) {
  const popover = document.getElementById("suggestions-popover");

  input.addEventListener("input", () => {
    const val = input.value;
    const selectionStart = input.selectionStart;

    if (!val) {
      closePopover();
      return;
    }

    const textBeforeCursor = val.substring(0, selectionStart);
    const words = textBeforeCursor.split(/\s+/);
    const currentWordIdx = words.length - 1;
    const currentWord = words[currentWordIdx];
    const wordStartIdx = textBeforeCursor.lastIndexOf(currentWord);

    if (val.startsWith("/")) {
      if (currentWordIdx === 0) {
        const clearCommands = EX_COMMANDS.filter(c => {
          if (["/mute", "/unmute", "/ban", "/unban", "/permaban", "/deleteall", "/kick", "/warn"].includes(c.name)) {
            return currentUserRole === "admin" || currentUserRole === "owner";
          }
          if (["/admin", "/unadmin", "/owner", "/unowner", "/subscription", "/deleteuser"].includes(c.name)) {
            return currentUserRole === "owner";
          }
          return true;
        }).filter(c => c.name.toLowerCase().startsWith(val.toLowerCase()));

        if (clearCommands.length > 0) {
          showCommands(clearCommands);
          return;
        } else {
          closePopover();
          return;
        }
      }
    }

    const baseCommandContext = words[0].toLowerCase();
    const targetAutocompleteCommands = ["/w", "/whisper", "/omoggle", "/privatevc", "/mute", "/unmute", "/admin", "/unadmin", "/owner", "/unowner", "/subscription", "/deleteuser", "/ban", "/unban", "/permaban", "/kick", "/warn"];

    if (targetAutocompleteCommands.includes(baseCommandContext)) {
      let isTargetingPhase = true;

      if (["/mute", "/unmute", "/admin", "/unadmin", "/owner", "/unowner", "/subscription", "/deleteuser", "/ban", "/unban", "/permaban", "/kick", "/warn"].includes(baseCommandContext) && currentWordIdx > 1) {
        isTargetingPhase = false;
      } else {
        for (let i = 1; i < currentWordIdx; i++) {
          if (!words[i].startsWith("@")) {
            isTargetingPhase = false;
            break;
          }
        }
      }

      if (isTargetingPhase) {
        let searchStr = currentWord;
        if (searchStr.startsWith("@")) {
          searchStr = searchStr.substring(1);
        }

        if (currentWord === words[0] || currentWord === "") {
          searchStr = "";
        }

        const cleanSearch = searchStr.toLowerCase();
        const filtered = getMentionSuggestionItems(cleanSearch);

        if (filtered.length > 0) {
          currentMentionTriggerIdx = wordStartIdx;
          showMentions(filtered, currentWord === words[0] ? "command-inline" : "whisper-target");
          return;
        }
      }
    }

    const lastAtIdx = val.lastIndexOf("@", selectionStart - 1);
    if (lastAtIdx !== -1 && (lastAtIdx === 0 || /\s/.test(val[lastAtIdx - 1]))) {
      const searchStr = val.substring(lastAtIdx + 1, selectionStart).toLowerCase();

      if (!/\s/.test(searchStr)) {
        currentMentionTriggerIdx = lastAtIdx;
        const filtered = getMentionSuggestionItems(searchStr);

        if (filtered.length > 0) {
          showMentions(filtered, "general-mention");
          return;
        }
      }
    }

    closePopover();
  });

  input.addEventListener("keydown", (e) => {
    const items = popover.querySelectorAll(".suggestion-item");
    if (popover.style.display === "block" && items.length > 0) {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        items[activeSuggestionIndex].classList.remove("selected");
        activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
        items[activeSuggestionIndex].classList.add("selected");
        items[activeSuggestionIndex].scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        items[activeSuggestionIndex].classList.remove("selected");
        activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
        items[activeSuggestionIndex].classList.add("selected");
        items[activeSuggestionIndex].scrollIntoView({ block: "nearest" });
      } else if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        items[activeSuggestionIndex].dispatchEvent(new Event("pointerdown"));
        items[activeSuggestionIndex].dispatchEvent(new Event("pointerup"));
      } else if (e.key === "Escape") {
        closePopover();
      }
    } else if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (currentUserBannedUntil && Date.now() < currentUserBannedUntil) {
        handleBannedUserDisplay();
        return;
      }
      document.getElementById("send-message-btn").click();
    }
  });

  document.addEventListener("pointerdown", (e) => {
    if (e.target !== input && e.target !== popover && !popover.contains(e.target)) {
      closePopover();
    }
  });
}

function showCommands(cmds) {
  const popover = document.getElementById("suggestions-popover");
  activeSuggestionIndex = 0;
  popover.innerHTML = "";

  cmds.forEach((c, idx) => {
    const div = document.createElement("div");
    div.className = "suggestion-item" + (idx === 0 ? " selected" : "");
    div.innerHTML = `<span class="item-icon">/</span> <strong>${c.name}</strong> &nbsp; <span style="color:var(--text-muted); font-size:0.8rem;">${c.desc}</span>`;

    attachTapOrScrollHandler(div, (e) => {
      e.preventDefault();
      e.stopPropagation();
      const input = document.getElementById("message-input");
      input.value = c.name + " ";
      input.focus();
      input.selectionStart = input.selectionEnd = input.value.length;
      closePopover();
      input.dispatchEvent(new Event("input"));
    });

    popover.appendChild(div);
  });
  popover.style.display = "block";
}

function showMentions(users, type) {
  currentMentionType = type;
  const popover = document.getElementById("suggestions-popover");
  activeSuggestionIndex = 0;
  popover.innerHTML = "";

  users.forEach((u, idx) => {
    const div = document.createElement("div");
    div.className = "suggestion-item" + (idx === 0 ? " selected" : "");
    const displayName = u.isSpecial ? `@${u.username}` : `@${u.username}`;
    div.innerHTML = `
      <div class="item-avatar"></div>
      <strong>${displayName}</strong>
    `;

    if (!u.isSpecial) {
      decorateAvatarElement(div.querySelector('.item-avatar'), u.id, u.username, u.avatar || u.username[0].toUpperCase());
    } else {
      const fallbackGradient = getGradient(u.username);
      const itemAvatar = div.querySelector('.item-avatar');
      if (itemAvatar) {
        itemAvatar.style.background = `linear-gradient(135deg, ${fallbackGradient})`;
        itemAvatar.textContent = u.avatar || '@';
      }
    }

    attachTapOrScrollHandler(div, (e) => {
      e.preventDefault();
      e.stopPropagation();
      const input = document.getElementById("message-input");
      const currentVal = input.value;
      let newCursorPos = 0;

      const cmdParts = currentVal.trim().split(/\s+/);
      const routingContextCmdStr = cmdParts[0];

      const mentionValue = u.username;
      if (currentMentionType === "command-inline") {
        input.value = routingContextCmdStr + " @" + mentionValue + " ";
        newCursorPos = input.value.length;
      } else if (currentMentionType === "whisper-target") {
        const beforeWord = currentVal.substring(0, currentMentionTriggerIdx);
        let spaceAfter = currentVal.indexOf(" ", currentMentionTriggerIdx);
        let afterWord = spaceAfter !== -1 ? currentVal.substring(spaceAfter) : "";
        input.value = beforeWord + "@" + mentionValue + (afterWord ? afterWord : " ");
        newCursorPos = (beforeWord + "@" + mentionValue + " ").length;
      } else {
        const beforeTrigger = currentVal.substring(0, currentMentionTriggerIdx);
        let spaceAfter = currentVal.indexOf(" ", currentMentionTriggerIdx);
        let afterWord = spaceAfter !== -1 ? currentVal.substring(spaceAfter) : " ";
        input.value = beforeTrigger + "@" + mentionValue + (afterWord.startsWith(" ") ? afterWord : " " + afterWord);
        newCursorPos = (beforeTrigger + "@" + mentionValue + " ").length;
      }

      input.focus();
      input.selectionStart = input.selectionEnd = newCursorPos;
      closePopover();
    });

    popover.appendChild(div);
  });
  popover.style.display = "block";
}

function closePopover() {
  const popover = document.getElementById("suggestions-popover");
  if (popover) {
    popover.style.display = "none";
    popover.innerHTML = "";
  }
}

async function handleScrollPagination() {
  const scroller = document.getElementById("message-scroller");

  if (scroller.scrollTop === 0 && !isLoadingMore && !allMessagesLoaded) {
    isLoadingMore = true;

    const loaderBanner = document.createElement("div");
    loaderBanner.id = "history-loading-banner";
    loaderBanner.style.cssText = "text-align: center; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; padding: 10px 0;";
    loaderBanner.textContent = "Getting more messages...";
    scroller.insertBefore(loaderBanner, scroller.firstChild);

    const initialScrollHeight = scroller.scrollHeight;

    try {
      const { data: olderMessages } = await supabase
        .from("messages")
        .select("*")
        .order("timestamp", { ascending: false })
        .range(historyPageOffset, historyPageOffset + MESSAGE_PAGE_SIZE - 1);

      const existingBanner = document.getElementById("history-loading-banner");
      if (existingBanner) existingBanner.remove();

      if (!olderMessages || olderMessages.length < MESSAGE_PAGE_SIZE) {
        allMessagesLoaded = true;
      }

      if (olderMessages && olderMessages.length > 0) {
        historyPageOffset += olderMessages.length;
        const fetchedHistorical = olderMessages.map(m => ({ ...m, isWhisper: false, isSystemMessage: m.role === "system" })).reverse();
        dbHistoricalMessages = [...fetchedHistorical, ...dbHistoricalMessages];

        renderMessages();
        scroller.scrollTop = scroller.scrollHeight - initialScrollHeight;
      }
    } catch (err) {
      console.error("Error loading older messages:", err);
      const existingBanner = document.getElementById("history-loading-banner");
      if (existingBanner) existingBanner.remove();
    }
    isLoadingMore = false;
  }
}

function getGradient(username) {
  const colors = ["#3b82f6, #7c3aed", "#f97316, #ec4899", "#06b6d4, #0891b2", "#10b981, #059669", "#f59e0b, #d97706"];
  let hash = 0;
  for (let i = 0; i < username.length; i++) {
    hash = username.charCodeAt(i) + ((hash << 5) - hash);
  }
  return colors[Math.abs(hash) % colors.length];
}

const avatarUrlCache = new Map();

function loadAvatarImageForUser(userId) {
  if (!userId) return null;

  const cachedUrl = avatarUrlCache.get(userId);
  if (cachedUrl) return cachedUrl;

  const entry = avatarIndexByUserId.get(userId);
  const avatarFileName = entry ? entry.fileName : `${userId}.jpg`;
  const publicUrl = supabase.storage
    .from("chat-files")
    .getPublicUrl(`avatars/${avatarFileName}`).data.publicUrl;

  avatarUrlCache.set(userId, publicUrl);
  return publicUrl;
}

function decorateAvatarElement(element, userId, username, fallbackText) {
  if (!element) return;

  const gradient = getGradient(username || "User");
  element.style.background = "var(--card)";
  element.innerHTML = "";

  if (!userId || !avatarIndexByUserId.has(userId)) {
    element.style.background = `linear-gradient(135deg, ${gradient})`;
    element.textContent = fallbackText;
    return;
  }

  const publicUrl = loadAvatarImageForUser(userId);
  if (!publicUrl) {
    element.style.background = `linear-gradient(135deg, ${gradient})`;
    element.textContent = fallbackText;
    return;
  }

  const image = document.createElement("img");
  image.alt = "Profile picture";
  image.loading = "lazy";
  image.decoding = "async";
  image.src = publicUrl;
  image.onerror = () => {
    element.innerHTML = "";
    element.style.background = `linear-gradient(135deg, ${gradient})`;
    element.textContent = fallbackText;
  };
  element.appendChild(image);
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

window.joinVoiceRoom = joinVoiceRoom;
window.leaveVoiceRoom = leaveVoiceRoom;
window.setParticipantMediaState = setParticipantMediaState;
window.updateGridParticipantLayout = updateGridParticipantLayout;
window.addEventListener('pagehide', () => {
  stopChatRuntime();
}, { once: true });

/* ── DOM READY INITIALIZATION SAFEGUARD ────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  // Safeguard: ensure layout calculations wait until DOM is fully parsed and rendered
  updateLayoutDimensions();

  if (isIOS) {
    const ssBtn = document.getElementById('vc-screenshare-btn');
    if (ssBtn) ssBtn.style.setProperty('display', 'none');
  }

  /* ── iOS VISUAL VIEWPORT & KEYBOARD EVENT BINDING ───────── */
  if (window.visualViewport) {
    const syncViewport = () => {
      updateLayoutDimensions();
    };

    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
    window.addEventListener('orientationchange', () => {
      setTimeout(syncViewport, 50);
    });
  }

  const messageInput = document.getElementById("message-input");
  if (messageInput) {
    messageInput.addEventListener("focus", () => {
      // Let Safari finish opening the keyboard before measuring the visual viewport.
      requestAnimationFrame(() => {
        setTimeout(updateLayoutDimensions, 50);
      });
    });

    messageInput.addEventListener("blur", () => {
      setTimeout(updateLayoutDimensions, 50);
    });
  }

  /* ── TOUCH SCROLLING INTERRUPTION PREVENTION ─────────────── */
  // Prevents root elastic bouncing on non-scrollable UI backgrounds
  // while allowing momentum flick-scrolling inside designated containers
  document.addEventListener('touchmove', function(e) {
    const scrollableContainer = e.target.closest('#message-scroller, #suggestions-popover, #vc-participant-grid');
    if (scrollableContainer) return; // Allow natural scrolling inside these elements
    
    // Allow touch interactions on interactive elements (buttons, links, inputs)
    const interactive = e.target.closest('button, a, input, [role="button"], .action-control-btn, .btn-duel-accept, .btn-duel-decline, .btn-upload-file, .vc-control-btn, .suggestion-item, .nav-auth-btn, .btn-primary');
    if (interactive) return;
    
    e.preventDefault(); // Prevent elastic bouncing on non-scrollable backgrounds
  }, { passive: false });
});
</script>
